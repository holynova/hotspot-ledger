app:['热点账本','Hotspot Ledger'],recording:['记录中','Recording'],paused:['已暂停','Paused'],idle:['未记录','Idle'],pause:['暂停记录','Pause recording'],resume:['恢复记录','Resume recording'],pauseTip:['暂停记录不会断开网络','Pausing does not disconnect Wi-Fi'],off:['Wi-Fi 已关闭','Wi-Fi is off'],noWifi:['未连接 Wi-Fi','No Wi-Fi connection'],resumed:['已续接记录，退出期间流量未计入。','Session resumed. Usage while the app was closed is excluded.'],markNote:['标记后，连接时自动记录。','Track this network automatically when connected.'],mark:['记录此 Wi-Fi','Track this Wi-Fi'],current:['本次 Wi-Fi 用量','Session Wi-Fi usage'],past:['历史 Wi-Fi 用量','Past Wi-Fi usage'],backCurrent:['回到当前','Back to current'],down:['下载','Download'],up:['上传','Upload'],total:['合计','Total'],speed:['传输速度','Transfer rate'],speedTable:['速度采样','Rate samples'],viewSamples:['查看速度采样表','View rate samples'],waiting:['等待采样','Waiting for samples'],now:['现在','Now'],minutes:['分钟前','min ago'],activity:['应用活动','App activity'],outlet:['Wi-Fi 出口','Wi-Fi traffic'],usage:['用量','Usage'],rate:['速率','Rate'],scope:['统计范围','Measurement'],sort:['应用排序','Sort apps'],ranking:['应用排行','App ranking'],empty:['暂无应用记录','No app records yet'],proxyOnly:['目前仅识别到代理转发，应用来源尚未归因。','Only proxy traffic was identified. Source apps are not attributed.'],proxy:['代理转发','Proxy forwarding'],proxyNote:['含应用转发流量，与应用活动重叠，不能相加。','Includes forwarded app traffic. It overlaps app activity; do not add the two.'],duration:['记录','Time'],dark:['深色','Dark'],light:['浅色','Light'],theme:['切换主题','Switch theme'],history:['历史','History'],settings:['设置','Settings'],disconnect:['断开 Wi-Fi','Wi-Fi off'],connect:['开启 Wi-Fi','Wi-Fi on'],disconnectTip:['关闭 Wi-Fi，会断开所有应用的无线网络','Turn off Wi-Fi for all apps'],close:['关闭窗口','Close window'],minimize:['最小化','Minimize'],zoom:['缩放窗口','Zoom window'],dismiss:['关闭提醒','Dismiss alert'],back:['返回','Back'],pathMissing:['路径不可用','Path unavailable'],processes:['个进程','processes'],process:['进程','Process'],origins:['来源记录','Recorded sources'],sourceNote:['在采样时保存，进程退出后仍可查看。未记录的来源不会补猜。','Saved during sampling L 账号或查询参数。','Source details stay on this Mac. Working directories, repositories and parent chains are recorded; full command lines, URL credentials and query strings are not.'],connections:['连接记录','Sessions'],noHistory:['还没有记录','No sessions yet'],time:['时间','Time'],language:['语言','Language'],networks:['自动记录的 Wi-Fi','Tracked Wi-Fi networks'],networkName:['Wi-Fi 名称','Wi-Fi name'],add:['添加','Add'],remove:['移除','Remove'],alerts:['用量提醒','Usage alerts'],sessionTotal:['本次累计','Session total'],recent:['最近 60 秒','Last 60 seconds'],limitLabel:['累计提醒 MB','Session alert in MB'],burstLabel:['短时提醒 MB','Short-term alert in MB'],zero:['填 0 关闭对应提醒。','Enter 0 to disable an alert.'],notify:['开启系统通知','Enable notifications'],auto:['达到阈值后关闭 Wi-Fi','Turn off Wi-Fi at the limit'],cutoffLabel:['断连阈值 MB','Cutoff limit in MB'],cutoffNote:['仅对正在记录的热点生效，会关闭所有应用的 Wi-Fi。可在首页重新开启；重连后重新计量。按采样周期检查，可能超出阈值。','Applies only to a tracked hotspot. Wi-Fi turns off for all apps. Turn it back on from the main screen; reconnecting starts a new session. Sampling delays may allow usage to exceed the limit.'],data:['数据目录','Data folder'],save:['保存','Save'],invalid:['请输入有效整数；断连阈值需大于 0，最多 1,000,000 MB。','Enter whole numbers up to 1,000,000 MB. The cutoff must be greater than 0.']};
function t(key){return words[key]?.[state?.language==='en'?1:0]??key}
function locale(){return state?.language==='en'?'en-US':'zh-CN'}
function dateText(n){return new Date(n).toLocaleString(locale())}
function send(action,args={}){window.webkit.messageHandlers.ledger.postMessage({action,...args})}
function bytes(n){return n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1000?(n/1000).toFixed(1)+' KB':Math.round(n)+' B'}

function samplePoints(){if(!state.points.length)return [];let end=state.points.at(-1).date,start=end-range*60000,width=range*60000/60,bins=Array.from({length:60},(_,slot)=>({slot,date:start+(slot+1)*width,down:0,up:0,time:0}));state.points.forEach((p,i)=>{let from=Math.max(start,i?state.points[i-1].date:p.date-2000),to=Math.min(end,p.date);if(to<=from)return;let first=Math.max(0,Math.floor((from-start)/width)),last=Math.min(59,Math.ceil((to-start)/width)-1);for(let j=first;j<=last;j++){let t=Math.max(0,Math.min(to,start+(j+1)*width)-Math.max(from,start+j*width));bins[j].down+=p.down*t;bins[j].up+=p.up*t;bins[j].time+=t}});return bins.filter(b=>b.time>0).map(b=>({...b,down:b.down/b.time,up:b.up/b.time}))}

function list(){let rows=[...state[scope]].filter(r=>!r.proxy).sort((a,b)=>metric==='rate'?b.rate-a.rate:(b.up+b.down)-(a.up+a.down)),max=Math.max(...rows.map(r=>metric==='rate'?r.rate:r.up+r.down),1);return `<div class="list" tabindex="0" aria-label="${t('ranking')}">${rows.length?rows.map(r=>`<button class="app-row" data-id="${esc(r.id)}" onclick="detail(this.dataset.id)"><div class="app-inner"><img class="real-icon" src="${r.icon}" alt=""><div><span class="appname">${esc(appName(r))}</span><div class="track"><i style="width:${(metric==='rate'?r.rate:r.up+r.down)/max*100}%"></i></div></div><div class="val">${metric==='rate'?(state.current?rateText(r.rate):'—'):bytes(r.up+r.down)}</div></div></button>`).join(''):`<p class="note">${t(state[scope].some(r=>r.proxy)?'proxyOnly':'empty')}</p>`}</div>`}
function proxyBlock(){let rows=state[scope].filter(r=>r.proxy),total=rows.reduce((n,r)=>n+r.up+r.down,0);return rows.length?`<details class="proxy" ${proxyExpanded?'open':''}><summary onclick="event.preventDefault();proxyExpanded=!this.parentElement.open;this.parentElement.open=proxyExpanded"><span><img src="${rows[0].icon}" alt="">${t('proxy')}</span><span class="proxy-value">${bytes(total)} ⌄</span></summary><p>${t('proxyNote')}</p>${rows.map(r=>`<button class="app-row" data-id="${esc(r.id)}" onclick="detail(this.dataset.id)"><span class="row"><span>${esc(appName(r))}</span><span>${bytes(r.up+r.down)}</span></span></button>`).join('')}</details>`:''}
function radios(name,values,current){return `<div class="radio-group" role="radiogroup" aria-label="${t(name==='scope'?'scope':'sort')}">${values.map(([v,key])=>`<label class="radio-option"><input type="radio" name="${name}" value="${v}" ${current===v?'checked':''} onchange="${name}=this.value;render()"><span>${t(key)}</span></label>`).join('')}</div>`}

function render(){if(!state)return;const focused=document.activeElement?.matches('input[type=radio]')?{name:document.activeElement.name,value:document.activeElement.value}:null;let oldScroll=$('.list')?.scrollTop||0;opened='';$('#app').className='window coral'+(state.nativeMenu?' native-menu':'')+(state.theme==='dark'?' night':'');let total=bytes(state.down+state.up).split(' ');$('#app').innerHTML=`<div class="titlebar"><div class="dots"><button aria-label="${t('close')}" onclick="send('close')"></button><button aria-label="${t('minimize')}" onclick="send('minimize')"></button><button aria-label="${t('zoom')}" onclick="send('zoom')"></button></div><span>${t('app')}</span><span class="key">⌘ H</span></div><div class="body"><div class="network"><div class="network-name">${wifi}<span>${esc(state.network||t(state.wifiOff?'off':'noWifi'))}</span></div><div class="row"><span class="status ${state.recording?'':'paused'}"><i></i>${t(state.recording?'recording':state.enabled?'idle':'paused')}</span><button class="iconbtn" onclick="send('toggle')" aria-label="${t(state.enabled?'pause':'resume')}" title="${t('pauseTip')}">${state.enabled?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3v10M11 3v10"/></svg>':'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>'}</button></div></div>${state.resumeCount?`<div class="note">${t('resumed')}</div>`:''}${state.issue?`<div class="note">${esc(state.issue)}</div>`:''}${state.alert?`<div class="note notice"><span>${esc(state.alert)}</span><button aria-label="${t('dismiss')}" onclick="send('dismissAlert')">×</button></div>`:''}${state.connection?`<div class="note">${esc(state.connection)}</div>`:''}${state.network&&!state.marked?`<div class="note">${t('markNote')} <button onclick="send('mark')">${t('mark')}</button></div>`:''}<div class="hero"><div><div class="eyebrow">${t(state.current?'current':'past')}${state.selectedID?` <button class="smalllink" onclick="send('select',{id:''})">${t('backCurrent')}</button>`:''}</div><div class="big">${total[0]}<span class="unit">${total[1]}</span></div></div><div class="totals"><span>${t('down')}</span><strong>${bytes(state.down)}</strong><span>${t('up')}</span><strong>${bytes(state.up)}</strong></div></div>${chart()}<div class="section"><div class="section-head">${radios('scope',[['apps','activity'],['outlet','outlet']],scope)}${radios('metric',[['total','usage'],['rate','rate']],metric)}</div>${list()}</div></div>${proxyBlock()}<div class="foot"><span>${t('duration')} ${elapsed()}</span><div class="right"><button onclick="cycleAppearance()" title="${themeAction()}" aria-label="${themeAction()}">${themeLabel()}</button><button onclick="historyPanel()">${t('history')}</button><button onclick="settings()">${t('settings')}</button><button class="disconnect" onclick="send(state.wifiOff?'enable':'disconnect')" ${state.busy||(!state.network&&!state.wifiOff)?'disabled':''} title="${t(state.wifiOff?'connect':'disconnectTip')}">${t(state.wifiOff?'connect':'disconnect')}</button></div></div><div id="panel"></div><div class="scroll-thumb" aria-hidden="true"></div>`;$('.list').scrollTop=oldScroll;if(focused)$(`input[name="${focused.name}"][value="${focused.value}"]`)?.focus({preventScroll:true})}
function panel(kind,title,html){opened=kind;$('#panel').innerHTML=`<section class="overlay" role="dialog" aria-label="${esc(title)}"><div class="nav"><button class="iconbtn" onclick="render()" aria-label="${t('back')}">←</button><h2>${esc(title)}</h2></div>${html}</section>`;$('.overlay .nav button').focus()}
function sourceRows(r){const origins=r.origins||[];if(!origins.length)return `<p>${t('unknownSource')}: ${bytes(r.down+r.up)}</p>`;const groups=new Map();for(const o of origins){const key=JSON.stringify([o.cwd,o.repository,o.remote,o.transferRemote,o.operation,(o.ancestors||[]).map(a=>a.path)]);if(!groups.has(key))groups.set(key,{...o,down:0,up:0,pids:new Set()});const g=groups.get(key);g.down+=o.down;g.up+=o.up;g.pids.add(o.pid);if(o.capturedAt)g.capturedAt=Math.max(g.capturedAt||0,o.capturedAt)}return [...groups.values()].sort((a,b)=>b.down+b.up-a.down-a.up).map(o=>{const title=o.repository?o.repository.split('/').filter(Boolean).at(-1):o.transferRemote?.split('/').at(-1)||o.ancestors?.find(a=>a.path.includes('.app/'))?.name||t(o.capturedAt?'sourceTitle':'unknownSource');return `<details class="source-entry"><summary><span>${esc(title)}</span><b>${bytes(o.down+o.up)}</b></summary><dl>${[['down',bytes(o.down)],['up',bytes(o.up)],['repo',o.repository],['transferRemote',o.transferRemote],['remote',o.remote],['operation',o.operation],['cwd',o.cwd],['captured',o.capturedAt?dateText(o.capturedAt):null]].map(([k,v])=>`<dt>${t(k)}</dt><dd>${esc(v||t('unknown'))}</dd>`).join('')}<dt>PID</dt><dd>${[...o.pids].join(', ')}</dd><dt>${t('ancestors')}</dt><dd>${o.ancestors?.length?o.ancestors.map(a=>esc(a.name)+' ('+a.pid+')').join(' ← '):t('unknown')}</dd></dl></details>`}).join('')}
function detail(id){let r=state[scope].find(r=>r.id===id);if(!r)return;inspected=id;panel('detail',appName(r),`<div class="eyebrow">${r.processCount||1} ${t('processes')}</div><div class="kv"><span>${t('down')}</span><b>${bytes(r.down)}</b></div><div class="kv"><span>${t('up')}</span><b>${bytes(r.up)}</b></div><div class="kv"><span>${t('total')}</span><b>${bytes(r.up+r.down)}</b></div><code>${esc(r.path||t('pathMissing'))}</code><h3>${t('origins')}</h3><p class="source-note">${t('sourceNote')}</p>${sourceRows(r)}<p class="source-note">${t('configNote')}</p><p>${t(r.proxy?'proxyDetail':'activityNote')}</p>`)}
function info(){panel('info',t('info'),[1,2,3,4,5,6].map(n=>`<p>${t('info'+n)}</p>`).join(''))}
function dailyHistory(sessions, en) {
  const groups = new Map();
  const unknown = [];
  for (const session of sessions) {
    let allocated = 0;
    for (const [day, usage] of Object.entries(session.days || {})) {
      const group = groups.get(day) || {day, down:0, up:0, entries:[]};
      const total = usage.down + usage.up;
      group.down += usage.down;
      group.up += usage.up;
      group.entries.push({session,total});
      groups.set(day,group);
      allocated += total;
    }
    if (session.total > allocated) unknown.push({session,total:session.total-allocated});
  }
  const days = [...groups.values()].sort((a,b)=>b.day.localeCompare(a.day));
  const peak = days.reduce((max,d)=>Math.max(max,d.down+d.up),0);
  function entries(rows) {
    return rows.map(({session,total})=>`<button class="history-entry" data-id="${esc(session.id)}" onclick="send('select',{id:this.dataset.id});render()"><span>${esc(session.network)}<span class="sub" style="display:block">${dateText(session.date)}</span></span><b>${bytes(total)} →</b></button>`).join('');
  }
  const list = days.map(d=>{
    const total=d.down+d.up;
    const label=new Date(d.day+'T12:00:00').toLocaleDateString(locale(),{year:'numeric',month:'short',day:'numeric'});
    return `<details class="history-day"><summary><b>${label}</b> <strong>${bytes(total)}</strong><span class="sub">${t('down')} ${bytes(d.down)}　${t('up')} ${bytes(d.up)}</span><span class="history-track"><i style="width:${peak?100*total/peak:0}%"></i></span></summary>${entries(d.entries)}</details>`;
  }).join('');
  if (!unknown.length) return list;
  return list + `<details class="history-day"><summary>${en?'Earlier usage without a daily breakdown':'旧记录中无法按天拆分的用量'} <strong>${bytes(unknown.reduce((sum,r)=>sum+r.total,0))}</strong></summary>${entries(unknown)}</details>`;
}
let historyMode = 'sessions';
function historyPanel() {
  const en = state.language === 'en';
  const choices = [['sessions', en ? 'By session' : '按连接'], ['days', en ? 'By day' : '按天']];
  const switcher = `<div class="radio-group" style="width:fit-content" role="radiogroup" aria-label="${t('history')}">${choices.map(([value,label]) => `<label class="radio-option"><input type="radio" name="historyMode" value="${value}" ${value===historyMode?'checked':''} onchange="historyMode=this.value;historyPanel();document.querySelector('input[name=historyMode]:checked').focus()"><span>${label}</span></label>`).join('')}</div>`;
  const sessions = state.history;
  if (!sessions.length || historyMode === 'days') {
    panel('history', t('history'), switcher + (sessions.length ? dailyHistory(sessions,en) : '<p>' + t('noHistory') + '</p>'));
    return;
  }
  const recent = sessions.slice(0, 12).reverse();
  const peak = recent.reduce((max, session) => Math.max(max, session.total), 0);
  const allPeak = sessions.reduce((max, session) => Math.max(max, session.total), 0);
  const percentage = (value, maximum) => maximum ? 100 * value / maximum : 0;
  const select = "send('select',{id:this.dataset.id});render()";
  const marks = recent.map(session => {
    const label = esc(session.network + ' — ' + dateText(session.date) + ' — ' + bytes(session.total));
    return `<button class="history-mark" data-id="${esc(session.id)}" onclick="${select}" title="${label}" aria-label="${label}"><i style="height:${percentage(session.total, peak)}%"></i></button>`;
  }).join('');
  const heading = en ? 'Recent session usage' : '最近连接用量';
  const dateLabel = session => new Date(session.date).toLocaleDateString(locale(), {month:'short', day:'numeric'});
  const trend = `<section class="history-chart" aria-label="${heading}"><div class="history-caption"><strong>${heading}</strong><span>${en ? 'Peak' : '最高'} ${bytes(peak)}</span></div><div class="history-marks">${marks}</div><div class="history-axis"><span>${dateLabel(recent[0])}</span><span>${en ? 'Latest' : '最近一次'}</span></div></section>`;
  const rows = sessions.map(session => `<button class="history-entry history-session" data-id="${esc(session.id)}" onclick="${select}"><span class="history-name">${esc(session.network)}<span class="sub">${dateText(session.date)}</span></span><b>${bytes(session.total)} →</b><span class="history-track" aria-hidden="true"><i style="width:${percentage(session.total, allPeak)}%"></i></span></button>`).join('');
  panel('history', t('history'), switcher + trend + rows);
}

nd('data')">${t('data')} ↗</button><button type="submit" class="primary" style="margin:0">${t('save')}</button></div></form>`);networkList()}

function saveSettings(){let limit=Number($('#limit').value),burst=Number($('#burst').value),automatic=$('#automatic').checked,disconnect=automatic?Number($('#disconnect').value):Number($('#disconnect').value)||1000;if(![limit,burst,disconnect].every(Number.isSafeInteger)||limit<0||burst<0||disconnect<1||Math.max(limit,burst,disconnect)>1000000){$('#form-error').textContent=t('invalid');return}send('save',{networks:draft.networks,limit,burst,automatic,disconnect});render()}
let railTimer;
function showRail(el){if(!el||el.scrollHeight<=el.clientHeight+1)return;let rail=$('.scroll-thumb');if(!rail)return;let r=el.getBoundingClientRect(),h=Math.max(22,el.clientHeight*el.clientHeight/el.scrollHeight);rail.style.height=h+'px';rail.style.top=(r.top+(el.clientHeight-h)*el.scrollTop/(el.scrollHeight-el.clientHeight))+'px';rail.style.left=(r.right-5)+'px';rail.classList.add('visible');clearTimeout(railTimer);railTimer=setTimeout(()=>rail.classList.remove('visible'),900)}
