.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

lex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.field input{width:100px;margin:0;text-align:right}.check{display:flex;align-items:center;gap:8px}.check input{display:inline;width:auto;margin:0;accent-color:var(--blue)}.network-list{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.network-list span{overflow-wrap:anywhere}.overlay .add{display:flex;align-items:center;gap:8px}.overlay .add input{margin:0;min-width:0;flex:1}.overlay .add button{flex-shrink:0;white-space:nowrap}.error{color:var(--text);font-size:11px;line-height:1.6}.overlay .closebar{position:sticky;bottom:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:12px 0}button:disabled{opacity:.45}.column.selected .ink{filter:brightness(.75)}#details-live{white-space:pre-wrap;font-size:11px;line-height:1.7;overflow-wrap:anywhere}.overlay code{user-select:text}.network-name{overflow-wrap:anywhere;min-width:0}.network-name>span:first-child{overflow-wrap:anywhere}.network{height:auto!important;min-height:38px}.network-name .pill{flex:none}.status{white-space:nowrap}.overlay .nav h2{flex:1;text-align:center;margin-right:26px}
.body,.overlay,.table-scroll{scrollbar-width:none}.body::-webkit-scrollbar,.overlay::-webkit-scrollbar,.table-scroll::-webkit-scrollbar{display:none;width:0;height:0}.scroll-thumb{position:fixed;width:3px;border-radius:3px;background:var(--muted);opacity:0;pointer-events:none;z-index:15;transition:opacity 150ms ease-out}.scroll-thumb.visible{opacity:.38}@media(prefers-reduced-motion:reduce){.scroll-thumb{transition:none}} .window .hero{height:55.75px}.eyebrow{line-height:14px}.big{height:36.75px}.totals{line-height:15px}.bar-axis{height:12.5px;line-height:12.5px}.seg button{line-height:14px}.range button{line-height:11.5px}.chart-head{height:18px}.app-inner>div:not(.val){line-height:14px}.sub{line-height:11.5px}.val{line-height:13px}.appname{line-height:14px} </style></head><body><article class="window coral" id="app"></article><script>let state=null,scope='apps',metric='total',range=5,opened='',inspected=null,draft=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(action,args={}){window.webkit.messageHandlers.ledger.postMessage({action,...args})}
function bytes(n){return n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1000?(n/1000).toFixed(1)+' KB':Math.round(n)+' B'}
function rateText(n){return n>=1e6?(n/1e6).toFixed(2)+' MB/s':n>=1000?(n/1000).toFixed(2)+' KB/s':Math.round(n)+' B/s'}
function elapsed(){let n=Math.max(0,Math.floor(((state.current?Date.now():state.ended)-state.started)/1000-(state.unobservedSeconds||0)));if(state.preview)n=1104;return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
const wifi='<svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".8" fill="currentColor"/></svg>';
function receive(s){state=s;$('#app').className='window coral'+(s.theme==='dark'?' night':'');if(!opened)render();else{if($('#details-live'))$('#details-live').textContent=s.details;if($('#notification-status'))$('#notification-status').textContent=s.notice;}}
function samplePoints(){if(!state.points.length)return [];let last=state.points.at(-1).date;let points=state.points.filter(p=>p.date>=last-range*60000),step=Math.max(1,Math.ceil(points.length/60));let result=[];for(let i=0;i<points.length;i+=step){let group=points.slice(i,i+step),d=0,u=0,t=0;group.forEach((p,j)=>{let dt=i+j>0?Math.max(.1,(p.date-points[i+j-1].date)/1000):2;t+=dt;d+=p.down*dt;u+=p.up*dt});result.push({date:group.at(-1).date,down:d/t,up:u/t})}return result}
function chart(){let a=samplePoints(),peak=Math.max(...a.map(p=>p.down+p.up),1),div=peak>=1e6?1e6:1000,unit=div===1e6?'MB/s':'KB/s',max=Math.max(1,Math.ceil(peak/div));return `<div class="chart-head"><button class="smalllink" onclick="speedTable()">传输速度 · ${unit} ↗</button><div class="range">${[1,5,15].map(n=>`<button class="${range===n?'on':''}" onclick="range=${n};render()">${n}m</button>`).join('')}</div></div><div class="microplot"><span class="ymax">${max}</span><span class="yzero">0</span><div class="columns">${a.map((p,i)=>`<button class="column" style="--h:${(p.down+p.up)/div/max*100}%" aria-label="${new Date(p.date).toLocaleTimeString('zh-CN')}，${bytes(p.down+p.up)}/s" onmouseenter="readBar(${i})" onfocus="readBar(${i})" onclick="speedTable()"><span class="ink"></span></button>`).join('')}</div></div><div class="bar-axis"><span>${a.length?'−'+range+' 分钟':'等待采样'}</span><span>现在</span></div><div class="chart-read"><span id="sample-label">最新采样</span><strong id="sample-value">${a.length?rateText(a.at(-1).down+a.at(-1).up):'—'}</strong></div>`}
function readBar(i){let p=samplePoints()[i];$('#sample-label').textContent=new Date(p.date).toLocaleTimeString('zh-CN');$('#sample-value').textContent=rateText(p.down+p.up)}
function list(){let rows=[...state[scope]].sort((a,b)=>metric==='rate'?b.rate-a.rate:(b.up+b.down)-(a.up+a.down)),max=Math.max(...rows.map(r=>metric==='rate'?r.rate:r.up+r.down),1),total=rows.reduce((n,r)=>n+r.up+r.down,0);return rows.length?`<div class="list">${rows.map((r,i)=>`<button class="app-row" data-id="${esc(r.id)}" onclick="detail(this.dataset.id)"><div class="app-inner"><img class="real-icon" src="${r.icon}" alt=""><div><span class="appname">${esc(r.name)}</span>${i===0?`<div class="sub">${esc(r.sub)}</div>`:''}<div class="track"><i style="width:${(metric==='rate'?r.rate:r.up+r.down)/max*100}%"></i></div></div><div class="val">${metric==='rate'?(state.current?bytes(r.rate)+'/s':'—'):bytes(r.up+r.down)}<div class="sub" title="占当前列表已识别用量的比例">${total?((r.up+r.down)/total*100).toFixed(1):'0.0'}%</div></div></div></button>`).join('')}</div>`:'<p class="note">开始记录后显示应用用量</p>'}
function render(){if(!state)return;let oldScroll=$('.body')?.scrollTop||0;opened='';$('#app').className='window coral'+(state.theme==='dark'?' night':'');let total=bytes(state.down+state.up).split(' ');$('#app').innerHTML=`<div class="titlebar"><div class="dots"><button aria-label="关闭窗口" onclick="send('close')"></button><button aria-label="最小化" onclick="send('minimize')"></button><button aria-label="缩放窗口" onclick="send('zoom')"></button></div><span>热点账本</span><span class="key">⌘ H</span></div><div class="body" tabindex="0" aria-label="流量概览"><div class="network"><div class="network-name">${wifi}<span>${esc(state.network||(state.wifiOff?'Wi-Fi 已关闭':'未连接 Wi-Fi'))}</span>${state.marked?'<span class="pill">热点</span>':''}</div><div class="row"><span class="status ${state.recording?'':'paused'}"><i></i>${state.recording?'记录中':state.enabled?'未记录':'已暂停'}</span><button class="iconbtn" onclick="send('toggle')" aria-label="${state.enabled?'暂停记录':'恢复记录'}" title="暂停记录不会断开网络">${state.enabled?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3v10M11 3v10"/></svg>':'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>'}</button></div></div>${state.resumeCount?'<div class="note">已续接上次记录，退出期间的流量未计入。</div>':''}${state.issue?`<div class="note">${esc(state.issue)}</div>`:''}${state.alert?`<div class="note notice"><span>${esc(state.alert)}</span><button aria-label="关闭提醒" onclick="send('dismissAlert')">×</button></div>`:''}${state.connection?`<div class="note">${esc(state.connection)}</div>`:''}${state.network&&!state.marked?'<div class="note">标记一次，以后连接时自动记录。 <button onclick="send(\'mark\')">记录此 Wi-Fi</button></div>':''}<div class="hero"><div><div class="eyebrow">${state.current?'本次用量':'历史用量'}${state.selectedID?' <button class="smalllink" onclick="send(\'select\',{id:\'\'})">回到当前</button>':''}</div><div class="big">${total[0]}<span class="unit">${total[1]}</span></div></div><div class="totals"><span>↓ 下载</span><strong>${bytes(state.down)}</strong><span>↑ 上传</span><strong>${bytes(state.up)}</strong></div></div>${chart()}<div class="section"><div class="row"><div class="seg"><button class="${scope==='apps'?'on':''}" onclick="scope='apps';render()">进程</button><button class="${scope==='outlet'?'on':''}" onclick="scope='outlet';render()">Wi-Fi 出口</button></div><div class="range"><button class="${metric==='total'?'on':''}" onclick="metric='total';render()">用量</button><button class="${metric==='rate'?'on':''}" onclick="metric='rate';render()">速率</button></div></div>${list()}</div></div><div class="foot"><span>${state.current&&!state.resumeCount?'已连接':'记录时长'} ${elapsed()}</span><div class="right"><button class="theme-btn" onclick="send('theme',{value:state.theme==='light'?'dark':'light'})" aria-label="切换主题">${state.theme==='light'?'◐ 黑色':'◑ 浅色'}</button><button onclick="info()" aria-label="统计说明">ⓘ</button><button onclick="historyPanel()">历史</button><button onclick="settings()">设置</button><button onclick="send(state.wifiOff?'enable':'disconnect')" ${state.busy||(!state.network&&!state.wifiOff)?'disabled':''} title="${state.wifiOff?'开启 Wi-Fi':'关闭 Wi-Fi，会断开所有应用的无线网络'}">${state.wifiOff?'连接':'断开'}</button></div></div><div id="panel"></div><div class="scroll-thumb" aria-hidden="true"></div>`;$('.body').scrollTop=oldScroll}
function panel(name,html){opened=name;$('#panel').innerHTML=`<section class="overlay" role="dialog" aria-label="${name}"><div class="nav"><button class="iconbtn" onclick="render()" aria-label="返回">←</button><h2>${name}</h2></div>${html}</section>`}
function detail(id){let r=state[scope].find(r=>r.id===id);if(!r)return;inspected=id;panel(r.name,`<div class="eyebrow">${esc(r.sub)}</div><div class="kv"><span>下载</span><b>${bytes(r.down)}</b></div><div class="kv"><span>上传</span><b>${bytes(r.up)}</b></div><div class="kv"><span>合计</span><b>${bytes(r.up+r.down)}</b></div><code>${esc(r.path||'路径不可用')}</code><p id="details-live">正在读取…</p>${r.proxy?'<p>此进程包含代理转发，不能与源应用用量相加。</p>':''}`);send('inspect',{id,scope})}
function info(){panel('统计说明','<p><b>进程：</b>用来查找来源，可能含代理前、回环和其他网络的活动。</p><p><b>Wi-Fi 出口：</b>无线网卡上的进程流量，代理可能代其他应用传输。不能与进程活动相加。</p><p>排行百分比是占当前列表已识别用量的比例，不是占手机账单的比例。</p><p>顶部为 Wi-Fi 网卡总量，含局域网和协议开销。速度柱为上传与下载合计。1 MB = 1,000,000 字节。</p><p>约每 2 秒采样，短连接可能漏记。关闭窗口仍继续记录。退出后重启，若仍为同名热点和同一网卡，则续接上次记录；退出期间流量不补计，时长扣除未记录间隔。同名网络不代表期间持续连接。</p>')}
function historyPanel(){panel('连接记录',state.history.map(s=>`<button class="history-entry" data-id="${esc(s.id)}" onclick="send('select',{id:this.dataset.id});render()"><span>${esc(s.network)}<div class="sub">${new Date(s.date).toLocaleString('zh-CN')}</div></span><b>${bytes(s.total)} →</b></button>`).join('')||'<p>还没有记录</p>')}
function speedTable(){panel('速度采样',`<div class="table-scroll"><table class="raw"><tr><th>时间</th><th>下载 /s</th><th>上传 /s</th></tr>${samplePoints().slice().reverse().map(p=>`<tr><td>${new Date(p.date).toLocaleTimeString('zh-CN')}</td><td>${bytes(p.down)}</td><td>${bytes(p.up)}</td></tr>`).join('')}</table></div>`)}
function settings(){draft=structuredClone(state.preferences);settingsForm()}
function settingsForm(){panel('设置',`<form id="settings-form" onsubmit="event.preventDefault();saveSettings()"><h3>自动记录的 Wi-Fi</h3><div id="networks"></div><div class="add"><input id="network-input" aria-label="Wi-Fi 名称" placeholder="Wi-Fi 名称"><button type="button" onclick="addNetwork()">添加</button></div><h3>用量提醒</h3><div class="field"><span>本次累计</span><input id="limit" required type="number" min="0" max="1000000" step="1" value="${draft.limit}" aria-label="累计提醒 MB">MB</div><div class="field"><span>最近 60 秒</span><input id="burst" required type="number" min="0" max="1000000" step="1" value="${draft.burst}" aria-label="短时提醒 MB">MB</div><p>填 0 关闭对应提醒。</p><button type="button" onclick="send('notify')">开启系统通知</button><p id="notification-status">${esc(state.notice)}</p><hr style="border:0;border-top:1px solid var(--line)"><label class="check"><input id="automatic" type="checkbox" ${draft.automatic?'checked':''} onchange="$('#cutoff').hidden=!this.checked;$('#disconnect').disabled=!this.checked">达到阈值后关闭 Wi-Fi</label><div id="cutoff" ${draft.automatic?'':'hidden'}><div class="field"><span>本次累计</span><input id="disconnect" required ${draft.automatic?'':'disabled'} type="number" min="1" max="1000000" step="1" value="${draft.disconnect}" aria-label="断连阈值 MB">MB</div><p>仅对正在记录的热点生效，会关闭所有应用的 Wi-Fi。可在首页重新开启；重连后重新计量。按采样周期检查，可能超出阈值。</p></div><p class="error" id="form-error"></p><div class="closebar"><button type="button" onclick="send('data')">数据目录 ↗</button><button type="submit" class="primary" style="margin:0">保存</button></div></form>`);networkList()}
function networkList(){$('#networks').innerHTML=draft.networks.map((n,i)=>`<div class="network-list"><span>${esc(n)}</span><button type="button" onclick="draft.networks.splice(${i},1);networkList()">移除</button></div>`).join('')}
function addNetwork(){let n=$('#network-input').value.trim();if(n&&!draft.networks.includes(n))draft.networks.push(n);$('#network-input').value='';networkList()}
function saveSettings(){let limit=Number($('#limit').value),burst=Number($('#burst').value),automatic=$('#automatic').checked,disconnect=automatic?Number($('#disconnect').value):Number($('#disconnect').value)||1000;if(![limit,burst,disconnect].every(Number.isSafeInteger)||limit<0||burst<0||disconnect<1||Math.max(limit,burst,disconnect)>1000000){$('#form-error').textContent='请输入有效整数；断连阈值需大于 0，最多 1,000,000 MB。';return}send('save',{networks:draft.networks,limit,burst,automatic,disconnect});render()}
let railTimer;
function showRail(el){if(!el||el.scrollHeight<=el.clientHeight+1)return;let rail=$('.scroll-thumb');if(!rail)return;let r=el.getBoundingClientRect(),h=Math.max(22,el.clientHeight*el.clientHeight/el.scrollHeight);rail.style.height=h+'px';rail.style.top=(r.top+(el.clientHeight-h)*el.scrollTop/(el.scrollHeight-el.clientHeight))+'px';rail.style.left=(r.right-5)+'px';rail.classList.add('visible');clearTimeout(railTimer);railTimer=setTimeout(()=>rail.classList.remove('visible'),900)}
document.addEventListener('scroll',e=>{if(e.target.matches?.('.body,.overlay,.table-scroll'))showRail(e.target)},true);
document.addEventListener('mouseover',e=>{let el=e.target.closest?.('.body,.overlay,.table-scroll');if(el)showRail(el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')render();if(e.metaKey&&e.key==='h'){e.preventDefault();historyPanel()}});
</script></body></html>
