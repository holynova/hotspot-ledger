<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;"><title>热点账本</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}.window{--surface:#fffdfa;--text:#262622;--muted:#706d66;--line:#e6e2db;--wash:#f2efe9;--blue:#d84c43;--tint:#fbe7e3;background:var(--surface);color:var(--text);height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}.window.night{color-scheme:dark;--surface:#222220;--text:#f4f1eb;--muted:#b6b1a7;--line:#3d3b36;--wash:#2e2d29;--blue:#f28c81;--tint:#44302d}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;border-radius:7px;padding:6px 9px;min-height:28px}button:hover{background:var(--wash)}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}::selection{background:var(--tint)}input{caret-color:var(--blue)}.titlebar{height:24px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:11px;color:var(--muted)}.dots{display:flex;gap:6px}.dots button{padding:0;width:9px;height:9px;min-height:0;background:var(--line);border-radius:50%}.dots button:hover{background:var(--blue)}.key{visibility:hidden}.body{display:flex;flex-direction:column;min-height:0;flex:1;overflow:auto}.network,.hero,.chart,.section-head{flex:none}.network{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px 6px;min-height:40px}.network-name{display:flex;gap:8px;align-items:center;font-weight:600;min-width:0;overflow-wrap:anywhere}.wifi{width:17px;height:17px;flex:none}.row{display:flex;align-items:center;justify-content:space-between;gap:5px}.status{font-size:11px;color:var(--muted);white-space:nowrap}.status i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);margin-right:5px}.status.paused i{background:var(--muted)}.iconbtn{width:26px;height:26px;min-height:26px;padding:5px;display:grid;place-items:center;color:var(--muted)}.iconbtn svg{width:14px;height:14px}.hero{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 12px}.eyebrow{font-size:11px;color:var(--muted)}.big{font-size:28px;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-weight:500}.unit{font-size:13px;color:var(--muted);letter-spacing:0;margin-left:3px}.totals{display:grid;grid-template-columns:auto auto;gap:2px 5px;font-size:11px;color:var(--muted);align-items:center}.totals strong{font-size:13px;font-weight:500;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}.chart{padding:0 16px 12px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-bottom:6px}.smalllink{font-size:11px;color:var(--muted);padding:0;min-height:24px}.range{display:flex;gap:1px}.range button{font-size:11px;min-height:24px;padding:2px 6px;color:var(--muted)}.range button.on{background:var(--wash);color:var(--text)}.columns{height:50px;display:grid;grid-template-columns:repeat(60,minmax(0,1fr));align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}.column{padding:0;min-width:0;min-height:0;flex:1;height:100%;display:flex;align-items:flex-end;border-radius:0}.column:hover{background:var(--wash)}.ink{display:block;width:100%;height:var(--h);min-height:2px;background:var(--blue);opacity:.8;border-radius:2px 2px 0 0}.column:hover .ink,.column:focus .ink{opacity:1}.bar-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:4px}.section{display:flex;flex-direction:column;flex:1;min-height:94px}.section-head{padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.radio-group{display:flex;gap:2px;align-items:center;background:var(--wash);padding:2px;border-radius:7px;min-width:0}.radio-option{position:relative;display:flex;align-items:center;cursor:pointer;white-space:nowrap}.radio-option input{position:absolute;opacity:0;width:1px;height:1px;margin:0}.radio-option span{display:block;padding:4px 8px;font-size:11px;color:var(--muted);border-radius:5px}.radio-option input:checked+span{background:var(--surface);color:var(--text);font-weight:600}.radio-option input:focus-visible+span{outline:2px solid var(--blue);outline-offset:1px}.radio-option:hover span{color:var(--text)}.list{padding:0 8px;flex:1;min-height:0;overflow:auto}.app-row{display:block;width:100%;padding:9px 8px;text-align:left;border-radius:5px;min-height:47px}.app-row+.app-row{border-top:1px solid var(--line)}.app-inner{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center}.real-icon{width:25px;height:25px;object-fit:contain}.appname{font-size:13px;font-weight:500;overflow-wrap:anywhere}.val{font-size:13px;font-weight:500;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}.track{height:3px;background:var(--wash);margin-top:5px;border-radius:2px;max-width:160px}.track i{display:block;height:100%;background:var(--blue);border-radius:2px}.sub{font-size:11px;color:var(--muted)}.proxy{flex:none;border-top:1px solid var(--line);padding:9px 16px;font-size:11px;color:var(--muted)}.proxy summary::-webkit-details-marker{display:none}.proxy summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.proxy summary img{width:18px;height:18px;vertical-align:middle;margin-right:5px}.proxy p{margin:7px 0 0}.proxy .app-row{font-size:11px;padding:7px 0;min-height:30px}.proxy .proxy-value{font-variant-numeric:tabular-nums}.foot{display:flex;justify-content:space-between;align-items:center;flex:none;border-top:1px solid var(--line);padding:7px 9px;gap:4px;color:var(--muted);font-size:11px}.foot .right{display:flex;gap:2px;align-items:center}.foot button{font-size:11px;padding:5px 6px}.foot>span{padding-left:6px}.disconnect{color:var(--blue)}.note{font-size:11px;color:var(--muted);padding:5px 16px;line-height:1.6;flex:none}.note button{padding:0;font-size:11px;color:var(--blue)}.notice{display:flex;justify-content:space-between;gap:8px}.overlay{position:absolute;inset:24px 0 0;background:var(--surface);z-index:10;padding:14px 16px;overflow:auto}.overlay .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.overlay h2{font-size:17px;margin:0;flex:1;text-align:center;padding-right:26px;overflow-wrap:anywhere}.overlay h3{font-size:13px;margin:20px 0 8px}.overlay p{font-size:13px;line-height:1.65}.overlay code{font-size:11px;user-select:text;overflow-wrap:anywhere}.kv,.history-entry,.network-list{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.history-entry{width:100%;text-align:left}.history-entry b{white-space:nowrap}.field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}.overlay input{border:1px solid var(--line);border-radius:6px;padding:7px;background:var(--wash);min-width:0}.field input{width:100px;text-align:right}.check{display:flex;gap:8px;align-items:center}.check input{accent-color:var(--blue)}.add{display:flex;align-items:center;gap:8px;margin-top:8px}.add input{flex:1}.network-list span{overflow-wrap:anywhere}.closebar{position:sticky;bottom:-14px;background:var(--surface);display:flex;justify-content:space-between;padding:12px 0}.primary{background:var(--text);color:var(--surface);padding:7px 16px}.primary:hover{background:var(--muted)}.error{color:var(--blue)}#details-live{white-space:pre-wrap;font-size:11px;overflow-wrap:anywhere}.raw{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}.raw th,.raw td{text-align:right;padding:9px 3px;border-bottom:1px solid var(--line)}.raw th:first-child,.raw td:first-child{text-align:left}.raw th{position:sticky;top:0;background:var(--surface)}.list,.body,.list,.overlay,.table-scroll{scrollbar-width:none}.list::-webkit-scrollbar,.body::-webkit-scrollbar,.overlay::-webkit-scrollbar,.table-scroll::-webkit-scrollbar{display:none}.scroll-thumb{position:fixed;width:3px;border-radius:3px;background:var(--muted);opacity:0;pointer-events:none;z-index:15;transition:opacity 150ms ease-out}.scroll-thumb.visible{opacity:.38}@media(prefers-reduced-motion:reduce){.scroll-thumb{transition:none}}</style></head><body><article class="window coral" id="app"></article><script>let state=null,scope='apps',metric='total',range=15,opened='',inspected=null,draft=null,proxyExpanded=false,pointerPressed=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(action,args={}){window.webkit.messageHandlers.ledger.postMessage({action,...args})}
function bytes(n){return n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1000?(n/1000).toFixed(1)+' KB':Math.round(n)+' B'}
function rateText(n){return n>=1e6?(n/1e6).toFixed(2)+' MB/s':n>=1000?(n/1000).toFixed(2)+' KB/s':Math.round(n)+' B/s'}
function elapsed(){let n=Math.max(0,Math.floor(((state.current?Date.now():state.ended)-state.started)/1000-(state.unobservedSeconds||0)));if(state.preview)n=1104;return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
const wifi='<svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".8" fill="currentColor"/></svg>';
function receive(s){state=s;$('#app').className='window coral'+(s.theme==='dark'?' night':'');if(!opened&&!pointerPressed)render();else{if($('#details-live'))$('#details-live').textContent=s.details;if($('#notification-status'))$('#notification-status').textContent=s.notice;}}
function samplePoints(){if(!state.points.length)return [];let end=state.points.at(-1).date,start=end-range*60000,width=range*60000/60,bins=Array.from({length:60},(_,slot)=>({slot,date:start+(slot+1)*width,down:0,up:0,time:0}));state.points.forEach((p,i)=>{let from=Math.max(start,i?state.points[i-1].date:p.date-2000),to=Math.min(end,p.date);if(to<=from)return;let first=Math.max(0,Math.floor((from-start)/width)),last=Math.min(59,Math.ceil((to-start)/width)-1);for(let j=first;j<=last;j++){let t=Math.max(0,Math.min(to,start+(j+1)*width)-Math.max(from,start+j*width));bins[j].down+=p.down*t;bins[j].up+=p.up*t;bins[j].time+=t}});return bins.filter(b=>b.time>0).map(b=>({...b,down:b.down/b.time,up:b.up/b.time}))}
function chart(){let a=samplePoints(),peak=Math.max(...a.map(p=>p.down+p.up),1);return `<section class="chart" aria-label="网络传输速度"><div class="chart-head"><button class="smalllink" onclick="speedTable()" aria-label="查看速度采样表">传输速度 <b id="sample-value">${a.length?rateText(a.at(-1).down+a.at(-1).up):'—'}</b></button><div class="range">${[1,5,15].map(n=>`<button class="${range===n?'on':''}" aria-pressed="${range===n}" onclick="range=${n};render()">${n}m</button>`).join('')}</div></div><div class="columns">${a.map((p,i)=>`<button class="column" style="grid-column:${p.slot+1};--h:${(p.down+p.up)/peak*100}%" aria-label="${new Date(p.date).toLocaleTimeString('zh-CN')}，${rateText(p.down+p.up)}" onmouseenter="readBar(${i})" onfocus="readBar(${i})" onclick="speedTable()"><span class="ink"></span></button>`).join('')}</div><div class="bar-axis"><span id="sample-label">${a.length?'−'+range+' 分钟':'等待采样'}</span><span>现在</span></div></section>`}
function readBar(i){let p=samplePoints()[i];$('#sample-label').textContent=new Date(p.date).toLocaleTimeString('zh-CN');$('#sample-value').textContent=rateText(p.down+p.up)}
function list(){let rows=[...state[scope]].filter(r=>!r.proxy).sort((a,b)=>metric==='rate'?b.rate-a.rate:(b.up+b.down)-(a.up+a.down)),max=Math.max(...rows.map(r=>metric==='rate'?r.rate:r.up+r.down),1);return `<div class="list" tabindex="0" aria-label="应用排行">${rows.length?rows.map(r=>`<button class="app-row" data-id="${esc(r.id)}" onclick="detail(this.dataset.id)"><div class="app-inner"><img class="real-icon" src="${r.icon}" alt=""><div><span class="appname">${esc(r.name)}</span><div class="track"><i style="width:${(metric==='rate'?r.rate:r.up+r.down)/max*100}%"></i></div></div><div class="val">${metric==='rate'?(state.current?rateText(r.rate):'—'):bytes(r.up+r.down)}</div></div></button>`).join(''):'<p class="note">'+(state[scope].some(r=>r.proxy)?'目前仅识别到代理转发，应用来源尚未归因。':'暂无应用记录')+'</p>'}</div>`}
function proxyBlock(){let rows=state[scope].filter(r=>r.proxy),total=rows.reduce((n,r)=>n+r.up+r.down,0);return rows.length?`<details class="proxy" ${proxyExpanded?'open':''}><summary onclick="event.preventDefault();proxyExpanded=!this.parentElement.open;this.parentElement.open=proxyExpanded"><span><img src="${rows[0].icon}" alt="">代理转发</span><span class="proxy-value">${bytes(total)} ⌄</span></summary><p>含应用转发流量，与应用活动重叠，不能相加。</p>${rows.map(r=>`<button class="app-row" data-id="${esc(r.id)}" onclick="detail(this.dataset.id)"><span class="row"><span>${esc(r.name)}</span><span>${bytes(r.up+r.down)}</span></span></button>`).join('')}</details>`:''}
function render(){if(!state)return;let oldScroll=$('.list')?.scrollTop||0;opened='';$('#app').className='window coral'+(state.theme==='dark'?' night':'');let total=bytes(state.down+state.up).split(' ');$('#app').innerHTML=`<div class="titlebar"><div class="dots"><button aria-label="关闭窗口" onclick="send('close')"></button><button aria-label="最小化" onclick="send('minimize')"></button><button aria-label="缩放窗口" onclick="send('zoom')"></button></div><span>热点账本</span><span class="key">⌘ H</span></div><div class="body"><div class="network"><div class="network-name">${wifi}<span>${esc(state.network||(state.wifiOff?'Wi-Fi 已关闭':'未连接 Wi-Fi'))}</span></div><div class="row"><span class="status ${state.recording?'':'paused'}"><i></i>${state.recording?'记录中':state.enabled?'未记录':'已暂停'}</span><button class="iconbtn" onclick="send('toggle')" aria-label="${state.enabled?'暂停记录':'恢复记录'}" title="暂停记录不会断开网络">${state.enabled?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3v10M11 3v10"/></svg>':'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>'}</button></div></div>${state.resumeCount?'<div class="note">已续接记录，退出期间流量未计入。</div>':''}${state.issue?`<div class="note">${esc(state.issue)}</div>`:''}${state.alert?`<div class="note notice"><span>${esc(state.alert)}</span><button aria-label="关闭提醒" onclick="send('dismissAlert')">×</button></div>`:''}${state.connection?`<div class="note">${esc(state.connection)}</div>`:''}${state.network&&!state.marked?'<div class="note">标记后，连接时自动记录。 <button onclick="send(\'mark\')">记录此 Wi-Fi</button></div>':''}<div class="hero"><div><div class="eyebrow">${state.current?'本次 Wi-Fi 用量':'历史 Wi-Fi 用量'}${state.selectedID?' <button class="smalllink" onclick="send(\'select\',{id:\'\'})">回到当前</button>':''}</div><div class="big">${total[0]}<span class="unit">${total[1]}</span></div></div><div class="totals"><span>下载</span><strong>${bytes(state.down)}</strong><span>上传</span><strong>${bytes(state.up)}</strong></div></div>${chart()}<div class="section"><div class="section-head"><div class="radio-group" role="radiogroup" aria-label="统计范围">${[['apps','应用活动'],['outlet','Wi-Fi 出口']].map(([v,label])=>`<label class="radio-option"><input type="radio" name="scope" value="${v}" ${scope===v?'checked':''} onchange="scope=this.value;render()"><span>${label}</span></label>`).join('')}</div><div class="radio-group" role="radiogroup" aria-label="应用排序">${[['total','用量'],['rate','速率']].map(([v,label])=>`<label class="radio-option"><input type="radio" name="metric" value="${v}" ${metric===v?'checked':''} onchange="metric=this.value;render()"><span>${label}</span></label>`).join('')}</div></div>${list()}</div></div>${proxyBlock()}<div class="foot"><span>记录 ${elapsed()}</span><div class="right"><button onclick="send('theme',{value:state.theme==='light'?'dark':'light'})" aria-label="切换主题">${state.theme==='light'?'深色':'浅色'}</button><button onclick="historyPanel()">历史</button><button onclick="settings()">设置</button><button class="disconnect" onclick="send(state.wifiOff?'enable':'disconnect')" ${state.busy||(!state.network&&!state.wifiOff)?'disabled':''} title="${state.wifiOff?'开启 Wi-Fi':'关闭 Wi-Fi，会断开所有应用的无线网络'}">${state.wifiOff?'开启 Wi-Fi':'断开 Wi-Fi'}</button></div></div><div id="panel"></div><div class="scroll-thumb" aria-hidden="true"></div>`;$('.list').scrollTop=oldScroll}
function panel(name,html){opened=name;$('#panel').innerHTML=`<section class="overlay" role="dialog" aria-label="${name}"><div class="nav"><button class="iconbtn" onclick="render()" aria-label="返回">←</button><h2>${name}</h2></div>${html}</section>`}
function detail(id){let r=state[scope].find(r=>r.id===id);if(!r)return;inspected=id;panel(r.name,`<div class="eyebrow">${esc(r.sub)}</div><div class="kv"><span>下载</span><b>${bytes(r.down)}</b></div><div class="kv"><span>上传</span><b>${bytes(r.up)}</b></div><div class="kv"><span>合计</span><b>${bytes(r.up+r.down)}</b></div><code>${esc(r.path||'路径不可用')}</code><p id="details-live">正在读取…</p>${r.proxy?'<p>此进程包含代理转发，不能与源应用用量相加。</p>':'<p>这是进程活动量，可能包含本机代理连接，不能直接作为手机流量分账。</p>'}`);send('inspect',{id,scope})}
function info(){panel('统计说明','<p><b>进程：</b>用来查找来源，可能含代理前、回环和其他网络的活动。</p><p><b>Wi-Fi 出口：</b>无线网卡上的进程流量，代理可能代其他应用传输。不能与进程活动相加。</p><p>应用排行不包含已识别的代理进程；代理在下方单独显示。分开展示不代表已完成去重或精确归因。</p><p>顶部为 Wi-Fi 网卡总量，含局域网和协议开销。速度柱为上传与下载合计。1 MB = 1,000,000 字节。</p><p>约每 2 秒采样，短连接可能漏记。关闭窗口仍继续记录。退出后重启，若仍为同名热点和同一网卡，则续接上次记录；退出期间流量不补计，时长扣除未记录间隔。同名网络不代表期间持续连接。</p>')}
function historyPanel(){panel('连接记录',state.history.map(s=>`<button class="history-entry" data-id="${esc(s.id)}" onclick="send('select',{id:this.dataset.id});render()"><span>${esc(s.network)}<div class="sub">${new Date(s.date).toLocaleString('zh-CN')}</div></span><b>${bytes(s.total)} →</b></button>`).join('')||'<p>还没有记录</p>')}
function speedTable(){panel('速度采样',`<div class="table-scroll"><table class="raw"><tr><th>时间</th><th>下载 /s</th><th>上传 /s</th></tr>${samplePoints().slice().reverse().map(p=>`<tr><td>${new Date(p.date).toLocaleTimeString('zh-CN')}</td><td>${bytes(p.down)}</td><td>${bytes(p.up)}</td></tr>`).join('')}</table></div>`)}
function settings(){draft=structuredClone(state.preferences);settingsForm()}
function settingsForm(){panel('设置',`<form id="settings-form" onsubmit="event.preventDefault();saveSettings()"><button type="button" class="smalllink" onclick="info()">统计说明 ↗</button><h3>自动记录的 Wi-Fi</h3><div id="networks"></div><div class="add"><input id="network-input" aria-label="Wi-Fi 名称" placeholder="Wi-Fi 名称"><button type="button" onclick="addNetwork()">添加</button></div><h3>用量提醒</h3><div class="field"><span>本次累计</span><input id="limit" required type="number" min="0" max="1000000" step="1" value="${draft.limit}" aria-label="累计提醒 MB">MB</div><div class="field"><span>最近 60 秒</span><input id="burst" required type="number" min="0" max="1000000" step="1" value="${draft.burst}" aria-label="短时提醒 MB">MB</div><p>填 0 关闭对应提醒。</p><button type="button" onclick="send('notify')">开启系统通知</button><p id="notification-status">${esc(state.notice)}</p><hr style="border:0;border-top:1px solid var(--line)"><label class="check"><input id="automatic" type="checkbox" ${draft.automatic?'checked':''} onchange="$('#cutoff').hidden=!this.checked;$('#disconnect').disabled=!this.checked">达到阈值后关闭 Wi-Fi</label><div id="cutoff" ${draft.automatic?'':'hidden'}><div class="field"><span>本次累计</span><input id="disconnect" required ${draft.automatic?'':'disabled'} type="number" min="1" max="1000000" step="1" value="${draft.disconnect}" aria-label="断连阈值 MB">MB</div><p>仅对正在记录的热点生效，会关闭所有应用的 Wi-Fi。可在首页重新开启；重连后重新计量。按采样周期检查，可能超出阈值。</p></div><p class="error" id="form-error"></p><div class="closebar"><button type="button" onclick="send('data')">数据目录 ↗</button><button type="submit" class="primary" style="margin:0">保存</button></div></form>`);networkList()}
function networkList(){$('#networks').innerHTML=draft.networks.map((n,i)=>`<div class="network-list"><span>${esc(n)}</span><button type="button" onclick="draft.networks.splice(${i},1);networkList()">移除</button></div>`).join('')}
function addNetwork(){let n=$('#network-input').value.trim();if(n&&!draft.networks.includes(n))draft.networks.push(n);$('#network-input').value='';networkList()}
function saveSettings(){let limit=Number($('#limit').value),burst=Number($('#burst').value),automatic=$('#automatic').checked,disconnect=automatic?Number($('#disconnect').value):Number($('#disconnect').value)||1000;if(![limit,burst,disconnect].every(Number.isSafeInteger)||limit<0||burst<0||disconnect<1||Math.max(limit,burst,disconnect)>1000000){$('#form-error').textContent='请输入有效整数；断连阈值需大于 0，最多 1,000,000 MB。';return}send('save',{networks:draft.networks,limit,burst,automatic,disconnect});render()}
let railTimer;
function showRail(el){if(!el||el.scrollHeight<=el.clientHeight+1)return;let rail=$('.scroll-thumb');if(!rail)return;let r=el.getBoundingClientRect(),h=Math.max(22,el.clientHeight*el.clientHeight/el.scrollHeight);rail.style.height=h+'px';rail.style.top=(r.top+(el.clientHeight-h)*el.scrollTop/(el.scrollHeight-el.clientHeight))+'px';rail.style.left=(r.right-5)+'px';rail.classList.add('visible');clearTimeout(railTimer);railTimer=setTimeout(()=>rail.classList.remove('visible'),900)}
document.addEventListener('scroll',e=>{if(e.target.matches?.('.body,.list,.overlay,.table-scroll'))showRail(e.target)},true);
document.addEventListener('mouseover',e=>{let el=e.target.closest?.('.body,.list,.overlay,.table-scroll');if(el)showRail(el)});
document.addEventListener('pointerdown',()=>{pointerPressed=true});
document.addEventListener('pointerup',()=>{setTimeout(()=>{pointerPressed=false;if(!opened)render()},0)});
document.addEventListener('pointercancel',()=>{pointerPressed=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')render();if(e.metaKey&&e.key==='h'){e.preventDefault();historyPanel()}});
</script></body></html>
